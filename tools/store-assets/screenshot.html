<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store screenshot</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 56px;
      padding: 0 64px 0 80px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      color: #052e16;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    .copy { width: 470px; flex: none; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; }
    .brand img { width: 40px; height: 40px; }
    h1 { margin-top: 28px; font-size: 52px; line-height: 1.08; letter-spacing: -0.02em; }
    .lede { margin-top: 20px; font-size: 20px; line-height: 1.5; color: #166534; }
    ul { margin-top: 28px; padding: 0; list-style: none; font-size: 18px; }
    li { display: flex; gap: 10px; margin-top: 12px; }
    li::before { content: "✓"; color: #16a34a; font-weight: 700; }

    .browser {
      position: relative;
      flex: 1;
      height: 640px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(5, 46, 22, 0.18);
      overflow: hidden;
    }
    .toolbar { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; background: #f1f5f9; }
    .dots { display: flex; gap: 7px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; }
    .url { flex: 1; height: 32px; border-radius: 16px; background: #ffffff; padding: 0 16px; line-height: 32px; font-size: 14px; color: #475569; }
    .toolbar img { width: 22px; height: 22px; outline: 3px solid #bbf7d0; border-radius: 6px; }
    .page { padding: 28px 32px; }
    .bar { height: 14px; border-radius: 7px; background: #e2e8f0; margin-bottom: 12px; }
    .hero { height: 200px; border-radius: 10px; background: #e2e8f0; margin: 22px 0; }

    .popup {
      position: absolute;
      top: 62px;
      right: 14px;
      width: 300px;
      height: 300px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.25);
      transform: scale(1.3);
      transform-origin: top right;
    }
  </style>
</head>
<body>
  <section class="copy">
    <p class="brand"><img src="../../extension/icons/icon128.png" alt=""> CO2 Footprint</p>
    <h1>How much CO₂ does this page cost?</h1>
    <p class="lede">Click the leaf on any website to see the carbon emitted by a single visit, with an A+ to F rating.</p>
    <ul>
      <li>One click, instant result</li>
      <li>No account, no tracking: nothing leaves your browser</li>
      <li>Based on the Sustainable Web Design Model</li>
    </ul>
  </section>

  <section class="browser">
    <div class="toolbar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="url">news.example.com</span>
      <img src="../../extension/icons/icon32.png" alt="">
    </div>
    <div class="page">
      <div class="bar" style="width: 55%; height: 26px"></div>
      <div class="bar" style="width: 35%"></div>
      <div class="hero"></div>
      <div class="bar"></div>
      <div class="bar" style="width: 92%"></div>
      <div class="bar" style="width: 80%"></div>
      <div class="bar" style="width: 88%"></div>
    </div>
    <iframe class="popup" src="popup-demo.html" title="CO2 Footprint popup"></iframe>
  </section>

  <script>
    // Fit the popup frame to its content once it has rendered.
    const frame = document.querySelector('.popup');
    setTimeout(() => {
      frame.style.height = `${frame.contentDocument.documentElement.scrollHeight}px`;
    }, 1000);
  </script>
</body>
</html>
