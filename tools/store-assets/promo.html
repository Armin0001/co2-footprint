<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store promo tile</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 32px;
      background: linear-gradient(135deg, #166534, #14532d);
      color: #ffffff;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 96px; height: 96px; flex: none; }
    h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; }
    p { margin-top: 10px; font-size: 16px; line-height: 1.4; color: #bbf7d0; }
  </style>
</head>
<body>
  <img src="../../extension/icons/icon128.png" alt="">
  <div>
    <h1>CO2 Footprint</h1>
    <p>The carbon cost of any web page, in one click.</p>
  </div>
</body>
</html>
